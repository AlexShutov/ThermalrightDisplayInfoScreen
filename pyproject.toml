[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwarescreen"
version = "0.1.0"
description = "Реактивный, с переподключением, дашборд для Thermalright Trofeo Vision 11.3 LCD (USB 0416:5408, LY)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyusb>=1.2",
    "pillow>=10",
    "psutil>=5.9",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Готовый Control Center (GPL-3.0) для продвинутых тем/видео, интегрирован как
# внешний движок. Не обязателен для портативного ядра (наш собственный LY-транспорт).
trcc = ["trcc-linux>=9.12"]
# Harness для dev/качества (lint, type-check, тесты). Не обязателен для запуска приложения.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "httpx2>=2.16"]

[project.scripts]
hardwarescreen = "hardwarescreen.__main__:main"
hardwarescreen-manager = "manager.__main__:main"
hardwarescreen-stubdata = "stubdata.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["dev/", "tools/probe_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src"]