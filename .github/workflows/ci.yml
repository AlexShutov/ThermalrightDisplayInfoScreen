name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Ворота качества
        env:
          PYTHON: python
        run: tools/quality_check.sh