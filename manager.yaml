# Конфигурация менеджера тем (YAML-первичный). Опции сначала добавлять в
# src/manager/config.py, потом использовать.
# По умолчанию биндиться локально; LAN-продюсеры задают host + auth_token.
host: 127.0.0.1
port: 8123
# Атомарный файл состояния моста (temp + os.replace; монотонный seq). Qt-адаптер
# опрашивает этот файл и реагирует на рост seq.
state_file: manager_state.json
# Отклонять тела запросов больше этого (HTTP 413 вместо OOM на малом RAM).
body_limit_bytes: 1000000
# Таймаут триггера день/ночь trcc (зависший демон не должен замораживать воркер).
switch_timeout_s: 10.0
default_mode: day
themes:
  day: d037
  night: d029
adapter:
  day:
    background: "#f2f3f7"
    panel: "#ffffff"
    accent: "#2e6fdb"
    text: "#1a1a1e"
    muted: "#6b7280"
  night:
    background: "#111318"
    panel: "#1b1e27"
    accent: "#4f9cf9"
    text: "#eef2f8"
    muted: "#8a93a6"
# Опционально: задать токен, чтобы требовать `Authorization: Bearer <token>` (LAN-продюсеры).
auth_token:
# Источник «текущей темы»: менеджер читает выбор пользователя из БД приложения
# настроек темы и переприменяет его после рестарта демона. Пути вынесены сюда,
# чтобы перенос приложения настроек (или trcc) был правкой одного значения.
# db_path: None -> слежение за темой отключено.
theme_settings:
  db_path: theme_reviews/themes.db
  device_key: "0416:5408"
  # trcc.json для проверки, что реально на панели; None -> платформенный дефолт.
  trcc_json_path: ~/Library/Application Support/trcc/trcc.json
  poll_s: 2.0
  apply_cooldown_s: 5.0
  trcc_cmd: [".venv-trcc/bin/trcc"]